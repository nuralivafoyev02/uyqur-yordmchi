<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uyqur Yordamchi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --tg-theme-bg-color: #fff;
            --tg-theme-text-color: #000;
            --tg-theme-button-color: #3390ec;
            --tg-theme-button-text-color: #fff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0; padding: 20px;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .report-card {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-delete {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-send {
            position: fixed;
            bottom: 20px; left: 20px; right: 20px;
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Mening Hisobotlarim</h2>
        <p id="user-name"></p>
    </div>

    <div id="reports-list">
        <p>Yuklanmoqda...</p>
    </div>

    <button class="btn-send" onclick="sendReport()">Guruhga Yuborish</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // App-ni to'liq ekranda ochish

        const SUPABASE_URL = 'https://trybbxovootehqvaiydn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyeWJieG92b290ZWhxdmFpeWRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc2ODk1MTYsImV4cCI6MjA4MzI2NTUxNn0.szjMQBYb8_ZNMq8rZyowVPTgD2GYLNnWEvs7XlCHY1M';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const userId = tg.initDataUnsafe.user?.id;
        document.getElementById('user-name').innerText = tg.initDataUnsafe.user?.first_name || '';

        async function loadReports() {
            const { data, error } = await supabaseClient
                .from('reports')
                .select('*')
                .eq('user_id', userId);

            const list = document.getElementById('reports-list');
            list.innerHTML = '';

            if (data && data.length > 0) {
                data.forEach(report => {
                    const div = document.createElement('div');
                    div.className = 'report-card';
                    div.innerHTML = `
                        <span>${report.type === 'text' ? report.content : '🖼 Rasm'}</span>
                        <button class="btn-delete" onclick="deleteItem(${report.id})">❌</button>
                    `;
                    list.appendChild(div);
                });
            } else {
                list.innerHTML = '<p>Hali hisobotlar yo\'q.</p>';
            }
        }

        async function deleteItem(id) {
            await supabaseClient.from('reports').delete().eq('id', id);
            loadReports();
        }

        function sendReport() {
            // Botga xabar yuborish orqali guruhga uzatishni ishga tushiramiz
            tg.sendData("/send"); 
            tg.close();
        }

        loadReports();
    </script>
</body>
</html>
