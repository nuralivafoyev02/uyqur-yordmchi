<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uyqur Yordamchi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #ffffff);
            --tg-text: var(--tg-theme-text-color, #222222);
            --tg-hint: var(--tg-theme-hint-color, #999999);
            --tg-link: var(--tg-theme-link-color, #0088cc);
            --tg-button: var(--tg-theme-button-color, #0088cc);
            --tg-button-text: var(--tg-theme-button-text-color, #ffffff);
            --tg-secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-bg);
            color: var(--tg-text);
            margin: 0;
            padding: 16px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
        }

        .count-badge {
            background: var(--tg-link);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        /* Skeleton Animation */
        .skeleton {
            background: linear-gradient(90deg, var(--tg-secondary-bg) 25%, var(--tg-bg) 50%, var(--tg-secondary-bg) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite ease-in-out;
            border-radius: 12px;
            height: 100px;
            margin-bottom: 12px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        #report-list { display: flex; flex-direction: column; gap: 14px; }

        .report-card {
            background: var(--tg-secondary-bg);
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border: 1px solid rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }

        .report-card:active { transform: scale(0.98); }

        .report-textarea {
            width: 100%;
            border: none;
            background: transparent;
            color: var(--tg-text);
            font-size: 16px;
            line-height: 1.5;
            resize: none;
            outline: none;
            padding: 0;
            margin-bottom: 12px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(0,0,0,0.05);
            padding-top: 10px;
        }

        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .btn-delete { color: #ff3b30; }
        .btn-save { 
            background: var(--tg-button); 
            color: var(--tg-button-text);
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            margin-top: 60px;
            color: var(--tg-hint);
        }

        .empty-icon { font-size: 48px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Mening ishlarim</h2>
        <span id="report-count" class="count-badge">0</span>
    </div>
    
    <div id="report-list">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        // Haptic Feedback uchun
        const haptic = tg.HapticFeedback;

        const SUPABASE_URL = 'https://trybbxovootehqvaiydn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyeWJieG92b290ZWhxdmFpeWRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc2ODk1MTYsImV4cCI6MjA4MzI2NTUxNn0.szjMQBYb8_ZNMq8rZyowVPTgD2GYLNnWEvs7XlCHY1M';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const userId = tg.initDataUnsafe?.user?.id;
        const listContainer = document.getElementById('report-list');
        const countBadge = document.getElementById('report-count');

        async function loadReports() {
            if (!userId) {
                listContainer.innerHTML = '<div class="empty-state">Telegram maʼlumotlari xatosi.</div>';
                return;
            }

            const { data, error } = await supabaseClient
                .from('reports')
                .select('*')
                .eq('user_id', userId)
                .eq('status', 'pending')
                .order('created_at', { ascending: false });

            if (error) {
                tg.showAlert("Xatolik: " + error.message);
                return;
            }

            renderReports(data);
        }

        function renderReports(reports) {
            listContainer.innerHTML = '';
            countBadge.innerText = reports.length;

            if (reports.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <p>Hozircha yuborilmagan ishlar yo'q.<br>Botga xabar yozing.</p>
                    </div>`;
                return;
            }

            reports.forEach(report => {
                const card = document.createElement('div');
                card.className = 'report-card';
                card.innerHTML = `
                    <textarea class="report-textarea" 
                        oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"
                        id="text-${report.id}">${report.content}</textarea>
                    <div class="card-footer">
                        <button class="btn-icon btn-delete" onclick="deleteReport('${report.id}')">
                            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                        <button class="btn-save" id="save-${report.id}" onclick="updateReport('${report.id}')">Saqlash</button>
                    </div>
                `;
                listContainer.appendChild(card);
                
                // Textarea balandligini moslash
                const txt = document.getElementById(`text-${report.id}`);
                txt.style.height = txt.scrollHeight + 'px';
            });
        }

        async function updateReport(id) {
            const content = document.getElementById(`text-${id}`).value;
            const btn = document.getElementById(`save-${id}`);
            
            btn.innerText = "⏳";
            const { error } = await supabaseClient.from('reports').update({ content }).eq('id', id);

            if (error) {
                tg.showAlert("Saqlanmadi!");
            } else {
                btn.innerText = "✅";
                btn.style.background = "#34c759";
                haptic.notificationOccurred('success');
                setTimeout(() => { 
                    btn.innerText = "Saqlash"; 
                    btn.style.background = ""; 
                }, 2000);
            }
        }

        async function deleteReport(id) {
            haptic.impactOccurred('medium');
            tg.showConfirm("Ushbu ishni ro'yxatdan o'chirmoqchimisiz?", async (ok) => {
                if (ok) {
                    const { error } = await supabaseClient.from('reports').delete().eq('id', id);
                    if (!error) {
                        loadReports();
                        haptic.notificationOccurred('warning');
                    }
                }
            });
        }

        loadReports();
    </script>
</body>
</html>
